server {
    listen 80;
    server_name alphadeputy.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name alphadeputy.com;

    ssl_certificate     /etc/letsencrypt/live/alphadeputy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alphadeputy.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # [开启 gzip 2026-10-16] 响应在发给浏览器前先压缩，浏览器收到后自动解压（对前端代码完全透明）。
    # nginx 官方镜像默认没开（主配置里 gzip on 是注释掉的），之前接口 JSON、前端 js/css 都是原样传输。
    # 例：股价走势接口单只股票约 72 KB，压缩后约 22 KB。
    gzip on;
    gzip_comp_level 5;          # 压缩级别 1-9：5 压缩率已接近上限，CPU 开销还小；再往上收益很少
    gzip_min_length 1024;       # 小于 1 KB 的响应不压缩：本来就小，压缩反而可能变大、白费 CPU
    gzip_vary on;               # 响应头加 Vary: Accept-Encoding，告诉中间缓存“压缩版和未压缩版要分开存”
    gzip_proxied any;           # 请求经过代理（如以后加 CDN / 负载均衡）时也照样压缩
    # 要压缩的类型。text/html 默认就会压缩，不用写；图片（png/jpg）、字体 woff2 本身已经压缩过，不要再压
    gzip_types
        application/json
        application/problem+json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /zipline/ {
        default_type application/json;
        return 501 '{"error":"Zipline service is not included in this repository"}';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
