services:
  db:
    image: postgres:16-alpine
    container_name: alpha-deputy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alpha_deputy}
      POSTGRES_USER: ${POSTGRES_USER:-alpha_deputy}
      POSTGRES_PASSWORD: ${ALPHA_DB_PASSWORD:?ALPHA_DB_PASSWORD is required}
    volumes:
      - alpha-deputy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alpha_deputy} -d ${POSTGRES_DB:-alpha_deputy}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: alpha-deputy-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-alpha_deputy};Username=${POSTGRES_USER:-alpha_deputy};Password=${ALPHA_DB_PASSWORD}
      JWT__Issuer: ${JWT_ISSUER:-http://100.117.210.50:18080}
      JWT__Audience: ${JWT_AUDIENCE:-http://100.117.210.50:18080}
      JWT__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      FMPKey: ${FMP_API_KEY:-}
      Storage__BacktestResultsDir: /workspace/Backtests
      PythonBacktestRunner__PythonExe: /opt/venv/bin/python
      PythonBacktestRunner__ScriptPath: execute/python_runner/runner.py
      PythonBacktestRunner__WorkingDirectory: /workspace
      PythonBacktestRunner__DataDirectory: /workspace/pipeline/data/backtest_data
    volumes:
      - ../Backtests:/workspace/Backtests
      - ../api/Backtest_runs:/workspace/api/Backtest_runs
      - ../api/sid_map.json:/app/sid_map.json
      - ../pipeline/data:/workspace/pipeline/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE: "${VITE_API_BASE-}"
        VITE_ZIPLINE_BASE: ${VITE_ZIPLINE_BASE:-/zipline}
        VITE_API_KEY: ${VITE_API_KEY:-}
    container_name: alpha-deputy-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-18080}:80"

volumes:
  alpha-deputy-postgres:
